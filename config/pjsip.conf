[global]
type=global
user_agent=VoIP-Lab-Asterisk

; ========================================
; Transport
; ========================================

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

; ========================================
; Shared endpoint template
; ========================================

[endpoint-template](!)
type=endpoint
transport=transport-udp
context=internal
disallow=all
allow=alaw,ulaw
direct_media=no
dtmf_mode=rfc4733
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
device_state_busy_at=1

[aor-template](!)
type=aor
max_contacts=1
remove_existing=yes
qualify_frequency=30

[auth-template](!)
type=auth
auth_type=userpass

; ========================================
; 1001 - Zakaznik
; ========================================

[1001](endpoint-template)
auth=auth1001
aors=1001
callerid=Zakaznik <1001>

[1001](aor-template)

[auth1001](auth-template)
username=1001
password=heslo1001

