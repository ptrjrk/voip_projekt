[general]
static=yes
writeprotect=yes
clearglobalvars=no

[globals]
SUPPORT_QUEUE=support
SUPPORT_MAILBOX=3000@support
QUEUE_TIMEOUT=30


[internal]

include => support-conf
include => support-ael
include => support-lua



exten => _100[1-3],1,NoOp(Internal call to ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN},30)
 same => n,Hangup()



exten => 3000,1,NoOp(Voicemail access)
 same => n,Answer()
 same => n,VoiceMailMain(${SUPPORT_MAILBOX})
 same => n,Hangup()



[support-conf]

exten => 2001,1,NoOp([CONF] Incoming call from ${CALLERID(num)})
 same => n,Answer()


 same => n,Set(DEMO_MODE=${DB(voip/mode)})
 same => n,GotoIf($["${DEMO_MODE}" = "open"]?open)
 same => n,GotoIf($["${DEMO_MODE}" = "closed"]?closed)


 same => n,GotoIfTime(08:00-15:59,mon-fri,*,*,Europe/Prague?open:closed)


 same => n(open),NoOp([CONF] Business hours: OPEN)
 same => n,NoOp([CONF] Routing to queue)

 same => n,Queue(${SUPPORT_QUEUE},,,,${QUEUE_TIMEOUT})
 same => n,NoOp([CONF] Queue status: ${QUEUESTATUS})


 same => n,GotoIf($["${ABANDONED}" = "FALSE"]?end:voicemail)


 same => n(closed),NoOp([CONF] Business hours: CLOSED)
 same => n,Goto(voicemail)


 same => n(voicemail),NoOp([CONF] Routing to voicemail)
 same => n,VoiceMail(${SUPPORT_MAILBOX},u)
 same => n,NoOp([CONF] Voicemail status: ${VMSTATUS})


 same => n(end),NoOp([CONF] Call finished)
 same => n,Hangup()


exten => h,1,NoOp([CONF] Channel disconnected)
